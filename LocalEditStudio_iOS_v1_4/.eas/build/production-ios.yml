build:
  name: Edit Studio production iOS build
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/resolve_build_config
    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id
    - run:
        name: Generate native Xcode project
        command: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          mkdir -p ios
          rsync -a \
            --exclude '.eas' \
            --exclude 'app.json' \
            --exclude 'eas.json' \
            --exclude 'package.json' \
            --exclude 'ios' \
            ./ ios/
          export DEVELOPMENT_TEAM="${{ steps.resolve_apple_team_id.apple_team_id }}"
          cd ios
          xcodegen generate
    - eas/configure_ios_credentials
    - eas/configure_ios_version
    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${{ job.secrets.buildCredentials }}
          scheme: LocalEditStudio
          build_configuration: Release
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
