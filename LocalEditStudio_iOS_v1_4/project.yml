name: LocalEditStudio
options:
  bundleIdPrefix: com.tyleralanis.localeditstudio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    branch: main

schemes:
  LocalEditStudio:
    build:
      targets:
        LocalEditStudio: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  LocalEditStudio:
    type: application
    platform: iOS
    sources:
      - path: LocalEditStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyleralanis.localeditstudio
        PRODUCT_NAME: Local Edit Studio
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LocalEditStudio/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
    entitlements:
      path: LocalEditStudio/LocalEditStudio.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
